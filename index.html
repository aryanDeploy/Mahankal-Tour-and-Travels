<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Make your Boyfriend's Day website</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,sans-serif;background:#fdf1f5;color:#3a2f35;display:grid;grid-template-columns:minmax(300px,440px) 1fr;height:100vh}
form{overflow:auto;padding:18px;background:#fff;border-right:1px solid #f0c9d6}
h1{font-size:22px;margin:0 0 4px;color:#e8456b}h2{font-size:16px;margin:22px 0 8px;padding-top:12px;border-top:1px solid #f3dde4;color:#e8456b}
label{display:block;font-size:14px;margin:10px 0 3px;color:#6b5a62}
input[type=text],textarea{width:100%;padding:10px;border:1px solid #e3c7d1;border-radius:8px;font:inherit}textarea{min-height:90px}
input[type=file]{width:100%;font-size:14px}.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.thumbs img{width:48px;height:48px;object-fit:cover;border-radius:6px}
.bar{position:sticky;bottom:-18px;background:#fff;padding:12px 0;display:flex;gap:8px;border-top:1px solid #f3dde4;margin-top:20px}
button{min-height:44px;padding:0 16px;border-radius:10px;border:0;font:600 15px system-ui;cursor:pointer}.go{background:#e8456b;color:#fff;flex:1}.rs{background:#f3dde4}
.help{font-size:13px;color:#8a7a82;margin:4px 0}.pv{height:100vh}iframe{width:100%;height:100%;border:0}
@media(max-width:800px){body{display:block;height:auto}form{border:0}.pv{height:70vh}}
</style></head><body>
<form id="f"><h1>Make your website</h1><p class="help">Fill in the boxes. The preview on the right updates as you go. When you're happy, press Download.</p><div id="fields"></div>
<div class="bar"><button type="button" class="go" id="dl">Download my website</button><button type="button" class="rs" id="rs">Reset</button></div>
<p class="help">After downloading: upload the file to a free host (for example Netlify Drop) to get a link you can send.</p></form>
<div class="pv"><iframe id="pv" title="Live preview"></iframe></div>
<script>
const TPL="<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Happy Boyfriend's Day<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Covered+By+Your+Grace&family=Petit+Formal+Script&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--pink:#e8456b;--soft-pink:#f7c6d4;--blue:#cfe3f3;--paper:#fffdfb;--text:#3a2f35;--yellow:#ffd93b;\n--hand:'Caveat Brush','Segoe Print',cursive;--note:'Covered By Your Grace','Segoe Print',cursive;--script:'Petit Formal Script',Georgia,serif}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;overflow:hidden;background:#e9f1f8;color:var(--text);font-family:var(--note)}\n.stripes{background:repeating-linear-gradient(90deg,#fff 0 clamp(14px,2.4vw,30px),var(--blue) 0 clamp(28px,4.8vw,60px))}\n.stage{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}\n.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,40px);\nopacity:0;visibility:hidden;transform:translateX(40px);transition:opacity .5s,transform .5s,visibility .5s;overflow:auto}\n.slide.on{opacity:1;visibility:visible;transform:none}\n.slide.out{transform:translateX(-40px)}\n.star{position:absolute;color:var(--pink);opacity:.75;font-size:clamp(16px,2.6vw,34px);animation:tw 3s ease-in-out infinite}\n@keyframes tw{50%{transform:scale(1.25) rotate(15deg)}}\n/* hero */\n.hero h1{font:clamp(54px,13vw,170px)/.95 var(--hand);color:var(--pink);text-align:center;position:relative;\ntext-shadow:2px 2px 0 #fff,3px 4px 0 #f4a6ba;animation:pop 1s cubic-bezier(.2,1.4,.4,1) both}\n.hero h1 i{font-style:normal;font-size:.5em;vertical-align:middle;margin:0 .1em}\n@keyframes pop{from{opacity:0;transform:scale(.7) rotate(-4deg)}}\n.bunny{position:absolute;width:clamp(70px,14vw,170px);right:3vw;bottom:5vh}\n.bunny.l{left:3vw;right:auto}\n/* bouquets */\n.pick{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,3vh,36px);width:100%;max-width:1000px}\n.pick h2{font:clamp(26px,5.4vw,64px) var(--hand);color:var(--pink);text-align:center;letter-spacing:.03em;text-shadow:2px 2px 0 #fff}\n.row{display:flex;gap:clamp(10px,3vw,40px);justify-content:center;flex-wrap:wrap}\n.bq{background:none;border:0;cursor:pointer;min-width:44px;min-height:44px;padding:0;text-align:center;font:inherit;transition:transform .25s}\n.bq span{display:block;font-size:clamp(84px,17vw,190px);line-height:1;filter:drop-shadow(3px 6px 4px rgba(0,0,0,.18))}\n.bq small{font-size:clamp(16px,2.2vw,24px);color:var(--pink)}\n.bq:hover{transform:translateY(-8px) rotate(-3deg)}\n.bq:active{transform:scale(.92)}\n.bq.seen small:after{content:\" \u2665\"}\n/* modal */\n.modal{position:fixed;inset:0;z-index:30;background:rgba(58,47,53,.55);display:none;align-items:center;justify-content:center;padding:16px}\n.modal.on{display:flex}\n.card{background:var(--paper);max-width:440px;width:100%;padding:16px 16px 22px;box-shadow:0 14px 40px rgba(0,0,0,.35);transform:rotate(-1.5deg);animation:pop .45s both;text-align:center;position:relative}\n.card p{font-size:clamp(20px,3vw,26px);margin-top:14px;line-height:1.3}\n.x{position:absolute;top:-14px;right:-10px;width:44px;height:44px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:22px;cursor:pointer}\n/* photo */\n.ph{background:var(--paper);padding:8px 8px 8px;box-shadow:0 6px 18px rgba(0,0,0,.2);position:relative}\n.ph img{display:block;width:100%;height:100%;object-fit:cover;aspect-ratio:var(--ar,4/3)}\n.ph figcaption{font-size:18px;text-align:center;padding-top:4px}\n.frame{background:var(--soft-pink);padding:clamp(8px,1.6vw,18px);position:relative}\n.frame:before{content:\"\u2605 \u2605 \u2605 \u2605 \u2605 \u2605 \u2605 \u2605 \u2605 \u2605\";position:absolute;top:-.1em;left:0;right:0;text-align:center;color:var(--pink);letter-spacing:.35em;font-size:14px;overflow:hidden;white-space:nowrap}\n.frame img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}\n/* memory */\n.mem{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(16px,4vw,60px);align-items:center;max-width:1100px;width:100%}\n.mem h2{font:clamp(48px,9vw,110px)/1 var(--hand);color:#e779b5;grid-column:1/-1;margin-bottom:-2vh}\n.list{font-size:clamp(20px,3.4vw,36px);line-height:1.25;text-align:center;height:min(58vh,420px);overflow:hidden;\n-webkit-mask:linear-gradient(transparent,#000 10%,#000 85%,transparent);mask:linear-gradient(transparent,#000 10%,#000 85%,transparent)}\n.list div{animation:scroll 16s linear infinite}\n@keyframes scroll{from{transform:translateY(40%)}to{transform:translateY(-100%)}}\n/* collage */\n.col{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2vw,22px);max-width:1000px;width:100%;position:relative;padding:0 6vw}\n.col .ph{--ar:1/1;transform:rotate(var(--r));transition:transform .3s}\n.col .ph:nth-child(3n){--ar:3/4}\n.col .ph:hover{transform:rotate(0) scale(1.06);z-index:2}\n/* music */\n.music{display:flex;gap:clamp(14px,3vw,36px);align-items:center;background:var(--paper);padding:clamp(16px,3vw,36px);max-width:860px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.18);transform:rotate(-.8deg);position:relative}\n.music .ph{flex:0 0 min(38%,260px);--ar:1/1;transform:rotate(3deg)}\n.ctl{flex:1;min-width:0}\n.ctl h2{font:clamp(32px,5vw,58px) var(--hand);color:var(--pink);line-height:1}\n.ctl p{font-size:22px;margin:4px 0 14px}\n.play{width:56px;height:56px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:22px;cursor:pointer}\n.bar{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:18px}\n.bar input{flex:1;accent-color:var(--pink);min-height:44px}\n.note{font-size:16px;color:#8a7a82;margin-top:6px}\n/* letter */\n.let{display:grid;grid-template-columns:1fr 1.2fr;gap:clamp(16px,4vw,56px);align-items:center;max-width:1050px;width:100%}\n.stamp{background:var(--pink);padding:14px;border-radius:6px;-webkit-mask:radial-gradient(circle 8px at 50% 0,#0000 98%,#000) top/22px 51% repeat-x;position:relative;\nbox-shadow:0 0 0 0 #0000;outline:0}\n.stamp{-webkit-mask:none;mask:none;border:8px dotted #fff;outline:14px solid var(--pink);margin:14px}\n.stamp img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}\n.bigstar{position:absolute;top:-34px;right:-34px;font-size:clamp(50px,9vw,110px);color:var(--yellow);text-shadow:0 2px 6px rgba(0,0,0,.2)}\n.letter h2{font:clamp(40px,6vw,76px)/1 var(--script);text-align:center}\n.letter p{font-size:clamp(19px,2.3vw,27px);line-height:1.45;margin-top:14px;white-space:pre-line;max-height:52vh;overflow:auto;padding-right:6px}\n/* final */\n.fin{background:linear-gradient(135deg,#fbd8e2,#fff1f4);width:min(94%,980px);min-height:min(80vh,620px);border-radius:14px;display:flex;flex-direction:column;\nalign-items:center;justify-content:center;text-align:center;padding:24px;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.15)}\n.fin h2{font:clamp(28px,5.4vw,62px)/1.15 var(--note);font-weight:400;max-width:14em}\n.fin h3{font:clamp(24px,4vw,44px) var(--hand);color:var(--pink);margin-top:12px}\n.fin svg{width:clamp(150px,30vw,300px);margin-top:16px}\n.fl{position:absolute;color:var(--pink);opacity:.5;animation:fl 5s ease-in-out infinite;font-size:clamp(18px,3vw,36px)}\n@keyframes fl{50%{transform:translateY(-18px) rotate(8deg)}}\n/* nav */\n.nav{position:fixed;top:50%;z-index:20;width:48px;height:48px;border-radius:50%;border:0;background:#fff9;color:var(--pink);font-size:26px;cursor:pointer;transform:translateY(-50%);box-shadow:0 2px 8px #0002}\n.nav.n{right:max(8px,env(safe-area-inset-right))}.nav.p{left:max(8px,env(safe-area-inset-left))}\n.nav[hidden]{display:none}\n.dots{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:20}\n.dots i{width:8px;height:8px;border-radius:50%;background:var(--pink);opacity:.3}.dots i.on{opacity:1}\nbutton:focus-visible{outline:3px solid #2b6cb0;outline-offset:3px}\n@media(max-width:700px){\n .mem,.let{grid-template-columns:1fr}.list{height:30vh}.col{grid-template-columns:repeat(2,1fr)}\n .music{flex-direction:column;text-align:center}.music .ph{flex-basis:auto;width:55%}.bar{justify-content:center}\n .slide{align-items:flex-start;padding-top:5vh;padding-bottom:50px}.hero,.fin-s{align-items:center}\n}\n@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n<\/style>\n<\/head>\n<body>\n<main class=\"stage stripes\" id=\"stage\" aria-live=\"polite\"><\/main>\n<button class=\"nav p\" id=\"prev\" aria-label=\"Previous page\" hidden>\u2039<\/button>\n<button class=\"nav n\" id=\"next\" aria-label=\"Next page\">\u203a<\/button>\n<div class=\"dots\" id=\"dots\"><\/div>\n<div class=\"modal\" id=\"modal\" role=\"dialog\" aria-modal=\"true\"><div class=\"card\" id=\"mcard\"><\/div><\/div>\n\n<script>\n/* ============ EDIT ONLY THIS BLOCK TO CUSTOMISE ============\n   photo: use a path like \"images/me.jpg\" \u2014 leave \"\" for a placeholder. */\nconst SITE = {\n  hero: [\"happy\",\"Boyfriend's\",\"Day\"],\n  pickText: \"CLICK ON ANY BOUQUET TO OPEN\",\n  bouquets: [\n    {icon:\"\ud83c\udf39\", title:\"Roses\", photo:\"\", message:\"You make ordinary days feel like my favourite ones.\"},\n    {icon:\"\ud83d\udc90\", title:\"Bouquet\", photo:\"\", message:\"I'm so proud of who you are and who you keep becoming.\"},\n    {icon:\"\ud83c\udf37\", title:\"Tulips\", photo:\"\", message:\"Being with you is my favourite place to be.\"}\n  ],\n  finalBouquets: [\n    {icon:\"\ud83c\udf38\", title:\"Blossoms\", photo:\"\", message:\"Thank you for every laugh, every hug, every little moment.\"},\n    {icon:\"\ud83c\udf3a\", title:\"Hibiscus\", photo:\"\", message:\"I'd choose you again in every lifetime.\"},\n    {icon:\"\ud83c\udf3b\", title:\"Sunflowers\", photo:\"\", message:\"You are my sunshine on the cloudiest days.\"}\n  ],\n  memory: {title:\"You're...\", photo:\"\", words:[\"my pookie\",\"my love\",\"my life\",\"my baby\",\"my boy\",\"my sweetheart\",\"my cutie\",\"my soulmate\",\"my forever\",\"my handsome\",\"my home\",\"my everything\",\"my whole heart\",\"my man\",\"my loverboy\",\"my cutiepie\",\"my babe\",\"my favorite\",\"my person\",\"my boyfriend\",\"my one & only\"]},\n  collage: [\"\",\"\",\"\",\"\",\"\",\"\",\"\",\"\"],\n  music: {title:\"Until I Found You\", artist:\"Stephen Sanchez\", cover:\"\", audio:\"\"}, /* audio: path to your own mp3 */\n  letter: {title:\"The sweet Letter\", photo:\"\", sign:\"With love, Yours\", body:\"If I could love you for one more day, I would love you for one more day.\\n\\nThank you for being patient with me, for making me laugh when I'm tired, and for being my safe place.\\n\\nWrite your own words here \u2014 this whole letter can be changed in the content block.\"},\n  final: {line:\"everyday i am thankful I'm lucky enough to have you in my life <3\", sub:\"Happy Boyfriend's Day \u2764\ufe0f\"}\n};\n/* =========================================================== */\n\nconst $=(s,r=document)=>r.querySelector(s), esc=t=>String(t).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst pal=[\"#f4a6ba\",\"#9cc5e8\",\"#ffd9a0\",\"#c9e4c5\",\"#d7c4ee\",\"#f7c6d4\",\"#a8d8d8\",\"#fbb\"];\nfunction img(src,i=0,alt=\"Photo\"){\n  if(src) return `<img src=\"${esc(src)}\" alt=\"${esc(alt)}\" loading=\"lazy\" onerror=\"this.src=ph(${i})\">`;\n  return `<img src=\"${ph(i)}\" alt=\"Placeholder photo \u2014 replace in content\">`;\n}\nfunction ph(i){const c=pal[i%pal.length];return \"data:image/svg+xml;utf8,\"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'><rect width='400' height='300' fill='${c}'/><text x='200' y='175' font-size='90' text-anchor='middle' fill='#fff' fill-opacity='.85'>\u2665<\/text><\/svg>`)}\nconst stars=(n,seed=1)=>Array.from({length:n},(_,i)=>{const a=(i*37+seed*23)%100,b=(i*61+seed*11)%100;return `<span class=\"star\" style=\"left:${a}%;top:${b}%;animation-delay:${i*.4}s\" aria-hidden=\"true\">\u2605<\/span>`}).join(\"\");\nconst bunny=(cls=\"\")=>`<svg class=\"bunny ${cls}\" viewBox=\"0 0 100 120\" aria-hidden=\"true\"><g fill=\"#fff\" stroke=\"#e58aa6\" stroke-width=\"3\"><ellipse cx=\"36\" cy=\"28\" rx=\"10\" ry=\"26\"/><ellipse cx=\"64\" cy=\"28\" rx=\"10\" ry=\"26\" transform=\"rotate(8 64 28)\"/><circle cx=\"50\" cy=\"78\" r=\"32\"/><\/g><g fill=\"#f7c6d4\"><ellipse cx=\"36\" cy=\"28\" rx=\"4\" ry=\"16\"/><ellipse cx=\"64\" cy=\"28\" rx=\"4\" ry=\"16\"/><circle cx=\"34\" cy=\"86\" r=\"5\"/><circle cx=\"66\" cy=\"86\" r=\"5\"/><\/g><circle cx=\"40\" cy=\"74\" r=\"2.5\" fill=\"#3a2f35\"/><circle cx=\"60\" cy=\"74\" r=\"2.5\" fill=\"#3a2f35\"/><path d=\"M46 84q4 4 8 0\" fill=\"none\" stroke=\"#3a2f35\" stroke-width=\"2\"/><\/svg>`;\n\nfunction pickSlide(list,key){\n  return `<section class=\"slide\"><div class=\"pick\"><h2>${esc(SITE.pickText)}<\/h2><div class=\"row\">${\n  list.map((b,i)=>`<button class=\"bq\" data-k=\"${key}\" data-i=\"${i}\" aria-label=\"Open ${esc(b.title)} bouquet\"><span>${b.icon}<\/span><small>${esc(b.title)}<\/small><\/button>`).join(\"\")\n  }<\/div><\/div>${stars(9,key.length)}<\/section>`;\n}\n\nconst slides=[\n ()=>`<section class=\"slide hero\"><h1><i>\u2661<\/i>${esc(SITE.hero[0])}<i>\u2661<\/i><br>${esc(SITE.hero[1])}<br>${esc(SITE.hero[2])}<\/h1>${stars(14,3)}${bunny()}<\/section>`,\n ()=>pickSlide(SITE.bouquets,\"a\"),\n ()=>`<section class=\"slide\"><div class=\"mem\"><h2>${esc(SITE.memory.title)}<\/h2><div class=\"frame\">${img(SITE.memory.photo,0,\"Memory photo\")}<\/div>\n   <div class=\"list\" aria-label=\"Sweet names\"><div>${SITE.memory.words.map(w=>`<p>${esc(w)}<\/p>`).join(\"\")}<\/div><\/div><\/div>${stars(8,5)}${bunny(\"l\")}<\/section>`,\n ()=>`<section class=\"slide\"><div class=\"col\">${SITE.collage.map((s,i)=>`<figure class=\"ph\" style=\"--r:${[-4,3,-2,5,-5,2,4,-3][i%8]}deg\">${img(s,i,\"Memory \"+(i+1))}<\/figure>`).join(\"\")}<\/div>${stars(10,7)}${bunny(\"l\")}<\/section>`,\n ()=>`<section class=\"slide\"><div class=\"music\"><figure class=\"ph\">${img(SITE.music.cover,2,\"Album art\")}<\/figure><div class=\"ctl\">\n   <h2>${esc(SITE.music.title)}<\/h2><p>${esc(SITE.music.artist)}<\/p>\n   <button class=\"play\" id=\"play\" aria-label=\"Play\">\u25b6<\/button>\n   <div class=\"bar\"><span id=\"cur\">0:00<\/span><input id=\"seek\" type=\"range\" min=\"0\" max=\"100\" value=\"0\" aria-label=\"Seek\"><span id=\"dur\">0:00<\/span><\/div>\n   <p class=\"note\" id=\"mnote\">${SITE.music.audio?\"\":\"Add your own audio file in the content block to enable playback.\"}<\/p><\/div><\/div>${stars(8,9)}${bunny(\"l\")}<\/section>`,\n ()=>`<section class=\"slide\"><div class=\"let\"><div style=\"position:relative\"><div class=\"stamp\">${img(SITE.letter.photo,1,\"Letter photo\")}<\/div><span class=\"bigstar\" aria-hidden=\"true\">\u2605<\/span><\/div>\n   <div class=\"letter\"><h2>${esc(SITE.letter.title)}<\/h2><p>${esc(SITE.letter.body)}\\n\\n${esc(SITE.letter.sign)}<\/p><\/div><\/div>${stars(8,11)}<\/section>`,\n ()=>pickSlide(SITE.finalBouquets,\"b\"),\n ()=>`<section class=\"slide fin-s\"><div class=\"fin\"><h2>${esc(SITE.final.line)}<\/h2>\n   <svg viewBox=\"0 0 200 130\" aria-label=\"Two bunnies holding hands\"><g fill=\"#fff\" stroke=\"#3a2f35\" stroke-width=\"2.5\"><path d=\"M45 20l-8-18 16 6zM75 20l8-18-16 6z\"/><circle cx=\"60\" cy=\"50\" r=\"28\"/><rect x=\"38\" y=\"76\" width=\"44\" height=\"50\" rx=\"14\"/><ellipse cx=\"130\" cy=\"22\" rx=\"7\" ry=\"20\"/><ellipse cx=\"152\" cy=\"22\" rx=\"7\" ry=\"20\"/><circle cx=\"141\" cy=\"56\" r=\"26\"/><rect x=\"120\" y=\"80\" width=\"42\" height=\"46\" rx=\"14\"/><\/g><g fill=\"#3a2f35\"><circle cx=\"50\" cy=\"48\" r=\"2.5\"/><circle cx=\"70\" cy=\"48\" r=\"2.5\"/><circle cx=\"133\" cy=\"54\" r=\"2.5\"/><circle cx=\"150\" cy=\"54\" r=\"2.5\"/><\/g><path d=\"M80 100h40\" stroke=\"#3a2f35\" stroke-width=\"3\"/><\/svg>\n   <h3>${esc(SITE.final.sub)}<\/h3>${Array.from({length:10},(_,i)=>`<span class=\"fl\" style=\"left:${(i*41+8)%92}%;top:${(i*29+6)%86}%;animation-delay:${i*.5}s\" aria-hidden=\"true\">\u2665<\/span>`).join(\"\")}<\/div>${stars(6,13)}<\/section>`\n];\n\nconst stage=$(\"#stage\"); let cur=0; const els=slides.map(f=>{stage.insertAdjacentHTML(\"beforeend\",f());return stage.lastElementChild});\n$(\"#dots\").innerHTML=slides.map(()=>\"<i><\/i>\").join(\"\");\nfunction go(n){n=Math.max(0,Math.min(slides.length-1,n));els.forEach((e,i)=>{e.classList.toggle(\"on\",i===n);e.classList.toggle(\"out\",i<n);e.inert=i!==n});\n [...$(\"#dots\").children].forEach((d,i)=>d.classList.toggle(\"on\",i===n));$(\"#prev\").hidden=n===0;$(\"#next\").hidden=n===slides.length-1;cur=n;\n const h=els[n].querySelector(\"h1\");if(h){h.style.animation=\"none\";h.offsetWidth;h.style.animation=\"\"}}\n$(\"#next\").onclick=()=>go(cur+1);$(\"#prev\").onclick=()=>go(cur-1);\naddEventListener(\"keydown\",e=>{if(e.key===\"ArrowRight\")go(cur+1);if(e.key===\"ArrowLeft\")go(cur-1);if(e.key===\"Escape\")closeM()});\nlet sx=null;addEventListener(\"touchstart\",e=>sx=e.touches[0].clientX,{passive:true});\naddEventListener(\"touchend\",e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>70)go(cur+(d<0?1:-1));sx=null});\n\n/* bouquet modal */\nconst modal=$(\"#modal\");function closeM(){modal.classList.remove(\"on\")}\nstage.addEventListener(\"click\",e=>{const b=e.target.closest(\".bq\");if(!b)return;\n const d=(b.dataset.k===\"a\"?SITE.bouquets:SITE.finalBouquets)[b.dataset.i];b.classList.add(\"seen\");\n $(\"#mcard\").innerHTML=`<button class=\"x\" aria-label=\"Close\">\u2715<\/button><figure class=\"ph\">${img(d.photo,+b.dataset.i+3,d.title)}<\/figure><p>${esc(d.message)}<\/p>`;\n modal.classList.add(\"on\");$(\".x\",modal).focus()});\nmodal.addEventListener(\"click\",e=>{if(e.target===modal||e.target.closest(\".x\"))closeM()});\n\n/* music (no autoplay) */\nconst fmt=s=>isFinite(s)?Math.floor(s/60)+\":\"+String(Math.floor(s%60)).padStart(2,\"0\"):\"0:00\";\nif(SITE.music.audio){const a=new Audio(SITE.music.audio),p=$(\"#play\"),sk=$(\"#seek\");\n p.onclick=()=>a.paused?a.play().catch(()=>$(\"#mnote\").textContent=\"Couldn't play this audio file.\"):a.pause();\n a.onplay=()=>{p.textContent=\"\u275a\u275a\";p.setAttribute(\"aria-label\",\"Pause\")};a.onpause=()=>{p.textContent=\"\u25b6\";p.setAttribute(\"aria-label\",\"Play\")};\n a.onloadedmetadata=()=>$(\"#dur\").textContent=fmt(a.duration);\n a.ontimeupdate=()=>{$(\"#cur\").textContent=fmt(a.currentTime);sk.value=a.currentTime/a.duration*100||0};\n sk.oninput=()=>a.currentTime=sk.value/100*a.duration;\n a.onerror=()=>$(\"#mnote\").textContent=\"Audio file not found.\"}\nelse{$(\"#play\").onclick=()=>$(\"#mnote\").textContent=\"Add your own audio file in the content block to enable playback.\"}\ngo(0);\n<\/script>\n<\/body>\n<\/html>\n";
const rx=/const SITE = \{[\s\S]*?\n\};/;
const DEF=new Function(TPL.match(rx)[0].replace('const SITE =','return')+';')();
let D=JSON.parse(JSON.stringify(DEF));
const build=d=>TPL.replace(rx,()=>'const SITE = '+JSON.stringify(d).replace(/</g,'\\u003c')+';');
const $=s=>document.querySelector(s),F=$('#fields');
const get=(o,p)=>p.split('.').reduce((a,k)=>a[k],o),set=(o,p,v)=>{const k=p.split('.');const l=k.pop();k.reduce((a,x)=>a[x],o)[l]=v};
function shrink(file,max=1000){return new Promise((res,rej)=>{if(!file.type.startsWith('image/'))return rej();const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.onerror=rej;im.src=URL.createObjectURL(file)})}
let t;const refresh=()=>{clearTimeout(t);t=setTimeout(()=>$('#pv').srcdoc=build(D),250)};
function text(label,p,area){const l=document.createElement('label');l.textContent=label;const i=document.createElement(area?'textarea':'input');if(!area)i.type='text';
 i.value=Array.isArray(get(D,p))?get(D,p).join('\n'):get(D,p);i.oninput=()=>{set(D,p,Array.isArray(get(D,p))?i.value.split('\n').filter(x=>x.trim()):i.value);refresh()};F.append(l,i)}
function photo(label,p,multi){const l=document.createElement('label');l.textContent=label+(multi?' (choose up to 8)':'');const i=document.createElement('input');i.type='file';i.accept='image/*';if(multi)i.multiple=true;
 const th=document.createElement('div');th.className='thumbs';
 i.onchange=async()=>{const fs=[...i.files].slice(0,multi?8:1);const out=[];for(const f of fs){try{out.push(await shrink(f))}catch(e){alert('"'+f.name+'" is not an image.')}}
  if(!out.length)return;if(multi){const cur=get(D,p).slice();out.forEach((o,k)=>cur[k]=o);set(D,p,cur)}else set(D,p,out[0]);
  th.innerHTML='';out.forEach(o=>{const m=new Image();m.src=o;th.append(m)});refresh()};F.append(l,i,th)}
function audio(label,p){const l=document.createElement('label');l.textContent=label;const i=document.createElement('input');i.type='file';i.accept='audio/*';
 const n=document.createElement('p');n.className='help';n.textContent='Only use a song you have the right to share. Keep it under 8 MB.';
 i.onchange=()=>{const f=i.files[0];if(!f)return;if(f.size>8e6){alert('That file is over 8 MB. Choose a smaller one.');i.value='';return}
  const r=new FileReader();r.onload=()=>{set(D,p,r.result);refresh()};r.readAsDataURL(f)};F.append(l,i,n)}
const H=t=>{const h=document.createElement('h2');h.textContent=t;F.append(h)};
function render(){F.innerHTML='';
 H('1. Opening page');text('Line 1','hero.0');text('Line 2','hero.1');text('Line 3','hero.2');
 H('2. First bouquets');DEF.bouquets.forEach((b,i)=>{text('Bouquet '+(i+1)+' message',`bouquets.${i}.message`,1);photo('Bouquet '+(i+1)+' photo',`bouquets.${i}.photo`)});
 H('3. "You\'re..." page');photo('Big photo','memory.photo');text('Sweet names (one per line)','memory.words',1);
 H('4. Photo collage');photo('Photos','collage',1);
 H('5. Song');text('Song title','music.title');text('Artist','music.artist');photo('Cover photo','music.cover');audio('Audio file (mp3)','music.audio');
 H('6. Love letter');text('Title','letter.title');photo('Photo','letter.photo');text('Letter','letter.body',1);text('Sign-off','letter.sign');

$('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([build(D)],{type:'text/html'}));a.download='index.html';a.click()};
$('#rs').onclick=()=>{if(confirm('Clear everything and start again?')){D=JSON.parse(JSON.stringify(DEF));render()}};
render();
